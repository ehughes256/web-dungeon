<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scroll Magic Phrases Test</title>
    <style>
        body {
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
        }
        .test-section {
            background: #222;
            border: 2px solid #444;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .scroll-item {
            padding: 5px;
            margin: 5px 0;
            background: #333;
            border-left: 3px solid #00ffff;
        }
        .identified {
            border-left-color: #00ff00;
        }
        button {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            margin: 5px;
        }
        button:hover {
            background: #555;
        }
        h1 { color: #00ffff; }
        h2 { color: #44aaff; }
    </style>
</head>
<body>
    <h1>📜 Scroll Magic Phrase System Test</h1>

    <div class="test-section">
        <h2>Test 1: Magic Phrase Assignments</h2>
        <div id="magicAssignments"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Unidentified Scrolls</h2>
        <div id="unidentifiedScrolls"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Identification</h2>
        <button onclick="identifyScroll(0)">Identify Psionic</button>
        <button onclick="identifyScroll(1)">Identify Teleport</button>
        <button onclick="identifyScroll(2)">Identify Mapping</button>
        <button onclick="identifyScroll(3)">Identify Fireball</button>
        <button onclick="identifyScroll(4)">Identify Regeneration</button>
        <button onclick="identifyScroll(5)">Identify Enchantment</button>
        <button onclick="identifyScroll(6)">Identify Uncurse</button>
        <button onclick="resetScrolls()">Reset</button>
        <div id="identifiedScrolls"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Randomization</h2>
        <button onclick="randomizePhrases()">Randomize Magic Phrases (New Game)</button>
        <div id="randomizationTest"></div>
    </div>

    <script src="monster.js"></script>
    <script src="player.js"></script>
    <script src="items.js"></script>
    <script src="maze.js"></script>

    <script>
        // Initialize the scroll magic phrase system
        initializeScrollMagicPhrases();

        // Create test scrolls
        let testScrolls = [
            new PsionicScroll(0, 0),
            new TeleportScroll(0, 0),
            new MappingScroll(0, 0),
            new FireballScroll(0, 0),
            new RegenerationScroll(0, 0),
            new EnchantmentScroll(0, 0),
            new UncurseScroll(0, 0)
        ];

        function displayMagicAssignments() {
            const div = document.getElementById('magicAssignments');
            let html = '<ul>';
            Object.entries(SCROLL_MAGIC_ASSIGNMENTS).forEach(([scrollType, magicPhrase]) => {
                html += `<li><strong>${scrollType}</strong> → scroll "<em>${magicPhrase}</em>"</li>`;
            });
            html += '</ul>';
            div.innerHTML = html;
        }

        function displayUnidentified() {
            const div = document.getElementById('unidentifiedScrolls');
            let html = '';
            testScrolls.forEach(scroll => {
                html += `
                    <div class="scroll-item">
                        Display Name: <strong>? ${scroll.getDisplayName()}</strong><br>
                        Actual Name: ${scroll.name} (hidden)<br>
                        Magic Phrase: "${scroll.magicName}"<br>
                        Identified: ${scroll.identified}
                    </div>
                `;
            });
            div.innerHTML = html;
        }

        function displayIdentified() {
            const div = document.getElementById('identifiedScrolls');
            let html = '';
            testScrolls.forEach(scroll => {
                html += `
                    <div class="scroll-item ${scroll.identified ? 'identified' : ''}">
                        Display Name: <strong>? ${scroll.getDisplayName()}</strong><br>
                        Magic Phrase: "${scroll.magicName}"<br>
                        Actual Name: ${scroll.name}<br>
                        Identified: ${scroll.identified}
                    </div>
                `;
            });
            div.innerHTML = html;
        }

        function identifyScroll(index) {
            if (testScrolls[index]) {
                testScrolls[index].identified = true;
                displayIdentified();
            }
        }

        function resetScrolls() {
            testScrolls = [
                new PsionicScroll(0, 0),
                new TeleportScroll(0, 0),
                new MappingScroll(0, 0),
                new FireballScroll(0, 0),
                new RegenerationScroll(0, 0),
                new EnchantmentScroll(0, 0),
                new UncurseScroll(0, 0)
            ];
            displayIdentified();
        }

        function randomizePhrases() {
            initializeScrollMagicPhrases();
            testScrolls = [
                new PsionicScroll(0, 0),
                new TeleportScroll(0, 0),
                new MappingScroll(0, 0),
                new FireballScroll(0, 0),
                new RegenerationScroll(0, 0),
                new EnchantmentScroll(0, 0),
                new UncurseScroll(0, 0)
            ];
            displayMagicAssignments();
            displayUnidentified();
            displayIdentified();

            const div = document.getElementById('randomizationTest');
            div.innerHTML = `<p style="color: #0f0;">✓ Magic phrases randomized! Check the assignments above.</p>`;
        }

        // Initial display
        displayMagicAssignments();
        displayUnidentified();
        displayIdentified();
    </script>
</body>
</html>
