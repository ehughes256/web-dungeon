<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Potion Color System Test</title>
    <style>
        body {
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
        }
        .test-section {
            background: #222;
            border: 2px solid #444;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .potion-item {
            padding: 5px;
            margin: 5px 0;
            background: #333;
            border-left: 3px solid #ff00ff;
        }
        .identified {
            border-left-color: #00ff00;
        }
        button {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            margin: 5px;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <h1>Potion Color System Test</h1>

    <div class="test-section">
        <h2>Test 1: Color Assignments</h2>
        <div id="colorAssignments"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Unidentified Potions</h2>
        <div id="unidentifiedPotions"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Identification</h2>
        <button onclick="identifyHealthPotion()">Identify Health Potion</button>
        <button onclick="identifySpeedPotion()">Identify Speed Potion</button>
        <button onclick="resetPotions()">Reset</button>
        <div id="identifiedPotions"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Randomization</h2>
        <button onclick="randomizeColors()">Randomize Colors (New Game)</button>
        <div id="randomizationTest"></div>
    </div>

    <script src="monster.js"></script>
    <script src="items.js"></script>
    <script src="potions.js"></script>
    <script src="weapons.js"></script>
    <script src="armor.js"></script>
    <script src="player.js"></script>
    <script src="maze.js"></script>

    <script>
        // Initialize the potion color system
        initializePotionColors();

        // Create test potions
        let healthPotion = new HealthPotion(0, 0);
        let speedPotion = new SpeedPotion(0, 0);

        function displayColorAssignments() {
            const div = document.getElementById('colorAssignments');
            const healthColorName = POTION_COLOR_ASSIGNMENTS['Health Potion'];
            const speedColorName = POTION_COLOR_ASSIGNMENTS['Speed Potion'];
            const healthHex = POTION_COLOR_HEX[healthColorName];
            const speedHex = POTION_COLOR_HEX[speedColorName];

            div.innerHTML = `
                <p>Health Potion → <strong style="color: ${healthHex}">⬤ ${healthColorName}</strong> potion (${healthHex})</p>
                <p>Speed Potion → <strong style="color: ${speedHex}">⬤ ${speedColorName}</strong> potion (${speedHex})</p>
            `;
        }

        function displayUnidentified() {
            const div = document.getElementById('unidentifiedPotions');
            const healthColor = healthPotion.getColor();
            const speedColor = speedPotion.getColor();

            div.innerHTML = `
                <div class="potion-item" style="border-left-color: ${healthColor}">
                    Display Name: <strong style="color: ${healthColor}">! ${healthPotion.getDisplayName()}</strong><br>
                    Visual Color: ${healthColor}<br>
                    Actual Name: ${healthPotion.name} (hidden)<br>
                    Identified: ${healthPotion.identified}
                </div>
                <div class="potion-item" style="border-left-color: ${speedColor}">
                    Display Name: <strong style="color: ${speedColor}">! ${speedPotion.getDisplayName()}</strong><br>
                    Visual Color: ${speedColor}<br>
                    Actual Name: ${speedPotion.name} (hidden)<br>
                    Identified: ${speedPotion.identified}
                </div>
            `;
        }

        function displayIdentified() {
            const div = document.getElementById('identifiedPotions');
            const healthColor = healthPotion.getColor();
            const speedColor = speedPotion.getColor();

            div.innerHTML = `
                <div class="potion-item ${healthPotion.identified ? 'identified' : ''}" style="border-left-color: ${healthColor}">
                    Display Name: <strong style="color: ${healthColor}">! ${healthPotion.getDisplayName()}</strong><br>
                    Visual Color: ${healthColor}<br>
                    Actual Name: ${healthPotion.name}<br>
                    Identified: ${healthPotion.identified}
                </div>
                <div class="potion-item ${speedPotion.identified ? 'identified' : ''}" style="border-left-color: ${speedColor}">
                    Display Name: <strong style="color: ${speedColor}">! ${speedPotion.getDisplayName()}</strong><br>
                    Visual Color: ${speedColor}<br>
                    Actual Name: ${speedPotion.name}<br>
                    Identified: ${speedPotion.identified}
                </div>
            `;
        }

        function identifyHealthPotion() {
            healthPotion.identified = true;
            displayIdentified();
        }

        function identifySpeedPotion() {
            speedPotion.identified = true;
            displayIdentified();
        }

        function resetPotions() {
            healthPotion = new HealthPotion(0, 0);
            speedPotion = new SpeedPotion(0, 0);
            displayIdentified();
        }

        function randomizeColors() {
            initializePotionColors();
            healthPotion = new HealthPotion(0, 0);
            speedPotion = new SpeedPotion(0, 0);
            displayColorAssignments();
            displayUnidentified();
            displayIdentified();

            const div = document.getElementById('randomizationTest');
            div.innerHTML = `<p style="color: #0f0;">✓ Colors randomized! Check the assignments above.</p>`;
        }

        // Initial display
        displayColorAssignments();
        displayUnidentified();
        displayIdentified();
    </script>
</body>
</html>
