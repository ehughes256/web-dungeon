<!DOCTYPE html>
<html>
<head>
    <title>Test Browser Load</title>
    <script src="monster.js"></script>
    <script src="player.js"></script>
    <script src="items.js"></script>
    <script src="scrolls.js"></script>
    <script src="maze.js"></script>
</head>
<body>
    <h1>Testing Class Availability</h1>
    <pre id="output"></pre>
    <script>
        const output = document.getElementById('output');
        const results = [];

        results.push('=== Checking Class Availability ===\n');

        // Check scroll classes
        results.push('Scroll classes:');
        results.push('  - Scroll: ' + (typeof Scroll !== 'undefined' ? '✓' : '✗ MISSING'));
        results.push('  - PsionicScroll: ' + (typeof PsionicScroll !== 'undefined' ? '✓' : '✗ MISSING'));
        results.push('  - TeleportScroll: ' + (typeof TeleportScroll !== 'undefined' ? '✓' : '✗ MISSING'));
        results.push('  - FireballScroll: ' + (typeof FireballScroll !== 'undefined' ? '✓' : '✗ MISSING'));

        results.push('\nItem classes:');
        results.push('  - Item: ' + (typeof Item !== 'undefined' ? '✓' : '✗ MISSING'));
        results.push('  - ItemManager: ' + (typeof ItemManager !== 'undefined' ? '✓' : '✗ MISSING'));
        results.push('  - ItemFactory: ' + (typeof ItemFactory !== 'undefined' ? '✓' : '✗ MISSING'));

        results.push('\nTesting ItemFactory.itemTypes:');
        try {
            const types = ItemFactory.itemTypes;
            results.push('  - ItemFactory.itemTypes loaded: ✓');
            results.push('  - Number of item types: ' + types.length);

            // Check if scroll classes are in the list
            const hasScrolls = types.some(t => t.class.name.includes('Scroll'));
            results.push('  - Contains scroll classes: ' + (hasScrolls ? '✓' : '✗ MISSING'));
        } catch (e) {
            results.push('  - ERROR: ' + e.message);
        }

        results.push('\nTesting scroll initialization:');
        try {
            initializeScrollMagicPhrases();
            results.push('  - initializeScrollMagicPhrases: ✓');
        } catch (e) {
            results.push('  - ERROR: ' + e.message);
        }

        results.push('\nTesting scroll creation:');
        try {
            const scroll = new PsionicScroll(0, 0);
            results.push('  - Create PsionicScroll: ✓');
            results.push('  - Scroll name: ' + scroll.name);
            results.push('  - Magic phrase: ' + scroll.magicName);
        } catch (e) {
            results.push('  - ERROR: ' + e.message);
        }

        output.textContent = results.join('\n');
    </script>
</body>
</html>
