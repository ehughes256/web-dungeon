<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roguelike Dungeon Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameContainer {
            display: flex;
            gap: 20px;
            position: relative;
        }

        #dungeon {
            background: #000;
            border: 2px solid #444;
            position: relative;
        }

        #sidebar {
            width: 300px;
            background: #222;
            border: 2px solid #444;
            padding: 15px;
            border-radius: 5px;
            height: 600px;
            overflow-y: auto;
            box-sizing: border-box;
            display: grid;
            grid-template-rows: auto 1fr auto auto;
        }

        button {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
        }

        button:hover {
            background: #555;
        }

        h2 {
            margin-top: 0;
            color: #ffaa00;
        }

        .stats {
            margin-bottom: 15px;
            display: flex;
        }

        .stat {
            margin: 5px 5px;
        }

        #inventorySection {
            margin-bottom: 10px;
            align-self: start;
        }

        #inventorySection h2 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffaa00;
        }

        #statsSection {
            align-self: end;
        }

        #statsSection h2 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffaa00;
        }

        .inv-section {
            margin-bottom: 12px;
        }

        .inv-section h4 {
            margin: 6px 0 4px;
            color: #ffcc33;
        }

        .inv-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: #2d2d2d;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 12px;
        }

        .inv-item-row + .inv-item-row {
            margin-top: 4px;
        }

        .inv-actions button {
            padding: 2px 4px;
            font-size: 12px;
        }

        .tag {
            background: #444;
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 11px;
            color: #ccc;
        }

        .equipped-section {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 15px;
        }

        .equipped-section h4 {
            margin: 0 0 8px 0;
            color: #88ff88;
            font-size: 14px;
        }

        .equipped-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
            font-size: 13px;
        }

        .equipped-slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 3px 6px;
            border-radius: 3px;
            border-left: 3px solid #444;
        }

        .equipped-slot.has-item {
            border-left-color: #88ff88;
        }

        .slot-label {
            color: #ccc;
            font-weight: bold;
            min-width: 50px;
        }

        .slot-item {
            color: #fff;
            flex: 1;
            text-align: right;
        }

        .slot-empty {
            color: #666;
            font-style: italic;
        }

        .slot-actions {
            margin-left: 6px;
        }

        .slot-actions button {
            padding: 2px 4px;
            font-size: 10px;
            background: #555;
            border: 1px solid #777;
            color: #fff;
            border-radius: 2px;
            cursor: pointer;
        }

        .slot-actions button:hover {
            background: #666;
        }

        #messages {
            margin-top: 15px;
            height: 160px;
            overflow-y: auto;
            background: #111;
            padding: 5px;
            border-radius: 3px;
            grid-row: 2;
            align-self: end;
        }

        /* Item Info Dialog */
        #itemDialog {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        #itemDialog.show {
            display: flex;
        }

        .dialog-content {
            background: #2a2a2a;
            border: 3px solid #ffaa00;
            border-radius: 8px;
            padding: 20px;
            max-width: 500px;
            min-width: 350px;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }

        .dialog-title {
            font-size: 20px;
            color: #ffaa00;
            font-weight: bold;
        }

        .dialog-close {
            background: #444;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .dialog-close:hover {
            background: #666;
        }

        .dialog-body {
            margin-bottom: 15px;
        }

        .dialog-description {
            font-style: italic;
            color: #ccc;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .dialog-stats {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
        }

        .dialog-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }

        .dialog-stat-row:last-child {
            border-bottom: none;
        }

        .dialog-stat-label {
            color: #aaa;
            font-weight: bold;
        }

        .dialog-stat-value {
            color: #fff;
        }

        .dialog-stat-value.positive {
            color: #88ff88;
        }

        .dialog-stat-value.negative {
            color: #ff8888;
        }

        .item-name-clickable {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        .item-name-clickable:hover {
            color: #ffcc33;
        }

        /* Enchantment Selection Dialog */
        #enchantmentDialog {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }

        #enchantmentDialog.show {
            display: flex;
        }

        .enchantment-content {
            background: #2a2a2a;
            border: 3px solid #ff99ff;
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            min-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 255, 0.4);
        }

        .enchantment-instructions {
            background: #1a1a1a;
            border: 1px solid #ff99ff;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 15px;
            color: #ccc;
        }

        .enchantment-section {
            margin-bottom: 15px;
        }

        .enchantment-section h4 {
            color: #ff99ff;
            margin: 10px 0 5px 0;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .enchantable-item {
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 4px;
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .enchantable-item:hover {
            border-color: #ff99ff;
            background: #2a2a2a;
            transform: translateX(5px);
        }

        .enchantable-item-info {
            flex: 1;
        }

        .enchantable-item-name {
            color: #ffaa00;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .enchantable-item-stats {
            color: #aaa;
            font-size: 0.9em;
        }

        .enchantable-item-current {
            color: #88ff88;
            font-size: 0.85em;
            margin-top: 3px;
        }
    </style>
    <script src="monster.js"></script>
    <script src="items.js"></script>
    <script src="potions.js"></script>
    <script src="traps.js"></script>
    <script src="scrolls.js"></script>
    <script src="weapons.js"></script>
    <script src="armor.js"></script>
    <script src="player.js"></script>
    <script src="maze.js"></script>
    <script src="game.js"></script>
</head>
<body>
<h1>Roguelike Dungeon Adventure</h1>
<div id="itemDialog" onclick="if(event.target === this) game.closeItemDialog()">
    <div class="dialog-content">
        <div class="dialog-header">
            <div class="dialog-title" id="dialogItemName">Item Name</div>
            <button class="dialog-close" onclick="game.closeItemDialog()">&times;</button>
        </div>
        <div class="dialog-body">
            <div class="dialog-description" id="dialogItemDescription">Item description goes here.</div>
            <div class="dialog-stats" id="dialogItemStats"></div>
        </div>
    </div>
</div>
<div id="enchantmentDialog" onclick="if(event.target === this) game.closeEnchantmentDialog()">
    <div class="enchantment-content">
        <div class="dialog-header">
            <div class="dialog-title">Select Item to Enchant</div>
            <button class="dialog-close" onclick="game.closeEnchantmentDialog()">&times;</button>
        </div>
        <div class="enchantment-instructions">
            Choose an item to enhance with magical power. Weapons gain damage, armor gains defense.
        </div>
        <div id="enchantmentItems"></div>
    </div>
</div>
<div id="gameContainer">
    <canvas id="dungeon" width="800" height="600"></canvas>
    <div id="sidebar">
        <div id="inventorySection">
            <div id="inventoryContents"></div>
        </div>
        <div id="statsSection">
            <div class="stats">
                <div class="stat">Lv:<span id="level">1</span></div>
                <div class="stat">Xp:<span id="exp">0</span></div>
                <div class="stat">H:<span id="health">100</span></div>
                <div class="stat">$:<span id="gold">0</span></div>
                <div class="stat">Wt:<span id="weight">0</span></div>
            </div>
        </div>
        <div id="messages">
            <div>Welcome to the dungeon!</div>
        </div>
    </div>
</div>
<script>
    class TimeManager {
        constructor(game) {
            this.game = game;
            this.futureEvents = {};
        }

        scheduleEvent(ticksFromNow, object, callback) {
            const execTick = this.game.currentTick + ticksFromNow;
            if (!this.futureEvents[execTick]) this.futureEvents[execTick] = [];
            const anEvent = {object: callback};
            this.futureEvents[execTick].push(anEvent);
        }

        async advanceTime() {
            this.game.currentTick++;
            await this.game.monsterManager.processTimeIncrement();
            if (Game.player.nextFreeHealTime <= this.game.currentTick) {
                Game.player.nextFreeHealTime = this.game.currentTick + 3000;
                Game.player.heal(1);
            }
            if (this.futureEvents[this.game.currentTick]) {
                const events = this.futureEvents[this.game.currentTick];
                delete this.futureEvents[this.game.currentTick];
                events.forEach(cb => cb.object(this.game));
            }
        }
    }

    // Game class is now in game.js

    let game;
    window.addEventListener('load', () => {
        game = new Game();
    });

    // Add keyboard support for closing dialog
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            const enchantDialog = document.getElementById('enchantmentDialog');
            if (enchantDialog && enchantDialog.classList.contains('show')) {
                game.closeEnchantmentDialog();
                return;
            }

            const itemDialog = document.getElementById('itemDialog');
            if (itemDialog && itemDialog.classList.contains('show')) {
                game.closeItemDialog();
            }
        }
    });
</script>
</body>
